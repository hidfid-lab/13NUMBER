<div id="scanner-container" style="position: relative; width: 100%; max-width: 400px; margin: auto;">
    <!-- 攝影機畫面 -->
    <video id="camera-preview" autoplay playsinline style="width: 100%; border-radius: 12px; background: #000;"></video>
    
    <!-- 掃描外框與雷射紅線 -->
    <div style="position: absolute; top: 20%; left: 10%; right: 10%; bottom: 20%; border: 2px solid #00E676; border-radius: 8px; pointer-events: none; box-shadow: 0 0 15px rgba(0,230,118,0.5);">
        <div style="position: absolute; top: 50%; width: 100%; height: 2px; background: #FF5252; animation: scanLine 2s infinite;"></div>
    </div>
</div>

<div id="scan-result" style="text-align: center; margin-top: 10px; font-weight: bold; font-size: 16px;">已偵測條碼：尚未掃描</div>

<script>
async function initScanner() {
    const video = document.getElementById('camera-preview');
    const resultDiv = document.getElementById('scan-result');

    // 檢查瀏覽器是否支援 BarcodeDetector API
    if (!('BarcodeDetector' in window)) {
        resultDiv.innerText = "此瀏覽器不支援原生條碼偵測，建議使用 Chrome 或 Safari";
        return;
    }

    const barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128'] });

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment' } // 優先使用後鏡頭
        });
        video.srcObject = stream;
        
        // 播放成功音效（BB聲）
        const playBeep = () => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 800; // 頻率
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15); // 持续 150ms
        };

        // 即時掃描迴圈
        const detectCode = async () => {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes.length > 0) {
                        const code = barcodes[0].rawValue;
                        resultDiv.innerText = `已偵測條碼：${code}`;
                        playBeep(); // 觸發 BB 聲
                        
                        // 這裡可以將 code 帶入你的系統欄位中，例如：
                        // document.getElementById('product-barcode-input').value = code;
                        
                        // 暫停一下避免重複觸發
                        await new Promise(resolve => setTimeout(resolve, 1500));
                    }
                } catch (err) {
                    console.error(err);
                }
            }
            requestAnimationFrame(detectCode);
        };

        video.addEventListener('play', () => {
            detectCode();
        });

    } catch (err) {
        resultDiv.innerText = "無法存取相機，請檢查權限設定";
    }
}

// 啟動掃描
initScanner();
</script>

<style>
@keyframes scanLine {
    0% { top: 0%; }
    50% { top: 100%; }
    100% { top: 0%; }
}
</style>
