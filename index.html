<div id="scanner-container" style="position: relative; width: 100%; max-width: 400px; margin: auto;">
    <!-- 攝影機畫面 -->
    <video id="camera-preview" style="width: 100%; border-radius: 12px; background: #000; object-fit: cover;" autoplay muted playsinline></video>
    
    <!-- 條碼對齊框 -->
    <div style="position: absolute; top: 40%; left: 15%; right: 15%; height: 20%; border: 2px solid #00E676; border-radius: 8px; pointer-events: none; box-shadow: 0 0 15px rgba(0,230,118,0.5);">
        <div style="position: absolute; top: 50%; width: 100%; height: 2px; background: #FF5252; animation: scanLine 2s infinite;"></div>
    </div>
</div>

<div id="scan-result" style="text-align: center; margin-top: 10px; font-weight: bold; font-size: 16px;">已偵測條碼：尚未掃描</div>

<!-- 載入 ZXing 條碼辨識庫 -->
<script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
<script>
window.addEventListener('load', function () {
    const codeReader = new ZXing.BrowserBarcodeReader();
    const resultDiv = document.getElementById('scan-result');

    const playBeep = () => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch (e) {
            console.log(e);
        }
    };

    // 使用進階設定，強制指定後鏡頭並提高解析度以改善近拍模糊
    const constraints = {
        video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
        }
    };

    navigator.mediaDevices.getUserMedia(constraints).then(stream => {
        const videoElement = document.getElementById('camera-preview');
        videoElement.srcObject = stream;
        
        codeReader.decodeFromVideo(videoElement, (result, err) => {
            if (result) {
                const code = result.text;
                resultDiv.innerText = `已偵測條碼：${code}`;
                playBeep();
            }
        });
    }).catch(err => {
        console.error(err);
        resultDiv.innerText = "無法啟動相機，請檢查權限設定";
    });
});
</script>

<style>
@keyframes scanLine {
    0% { top: 0%; }
    50% { top: 100%; }
    100% { top: 0%; }
}
</style>
